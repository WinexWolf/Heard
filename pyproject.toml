[project]
name = "heard"
version = "0.1.0"
description = "Catch accessibility regressions on every push by listening to your app the way a screen-reader user does."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["accessibility", "a11y", "screen-reader", "wcag", "ci", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "playwright>=1.44",
    "ffmpeg>=1.4",
]

[project.urls]
Homepage = "https://github.com/WinexWolf/Heard"
Issues = "https://github.com/WinexWolf/Heard/issues"

[project.scripts]
heard = "heard.app.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heard"]
exclude = ["heard/tests"]

[tool.hatch.build.targets.sdist]
include = ["heard", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["heard/tests"]

[tool.pytest.ini_options]
testpaths = ["heard/tests"]
pythonpath = ["."]
