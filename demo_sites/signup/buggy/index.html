<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="bar"><h1>Create account</h1></header>
<main>
<form id="signup" novalidate>
<label for="name">Full name</label>
<input id="name" type="text" autocomplete="name">
<input id="email" type="email" placeholder="Email address" autocomplete="email">
<div id="email-error" class="error"></div>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="new-password">
<div id="terms" class="checkbox" tabindex="0"><span class="box"></span><span>I agree to the terms</span></div>
<p><button type="submit" id="submit-btn" aria-label="Continue">Create account</button></p>
</form>
</main>
<script src="app.js"></script>
</body></html>
